name = "yang_mills"
version = "1.0.0"
defaultTargets = ["ExistenceChallenge", "ExistenceSolution", "MatchingChallenge", "MatchingSolution"]

[leanOptions]
maxHeartbeats = 0
maxRecDepth = 4096

[[lean_lib]]
name = "StatementLibrary"
roots = ["FormalConversion", "MSConversion", "MSFormalSeries", "MSGradeProjection", "MSNumericalAdjustment", "MSOrdinaryOPE", "MSPositionCubic", "MSPositionFrame", "MSPositionLabels", "MSPositionPrescription", "MSPositionScreens", "MSReference", "MSScalarInverse", "MSScalarReverse", "YM", "YangMills", "MaxwellBridge", "Solution", "TraceBridge", "WardBridge"]

[[lean_lib]]
name = "MatchingChallenge"
roots = ["Comparators.Matching.Challenge"]

[[lean_lib]]
name = "MatchingSolution"
roots = ["Comparators.Matching.Solution"]

[[lean_lib]]
name = "ExistenceChallenge"
roots = ["Comparators.Existence.Challenge"]

[[lean_lib]]
name = "ExistenceSolution"
roots = ["Comparators.Existence.Solution"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "81a5d257c8e410db227a6665ed08f64fea08e997"
